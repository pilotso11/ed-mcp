name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; `npm stage` is known to work from 11.17.0.
      - run: npm install -g npm@^11.17.0
      - run: npm ci
      - name: Check tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm run check
      - run: npm run pack:mcpb
      # Records that this workflow built the .mcpb from this commit. Players can check it with
      # `gh attestation verify <file> --repo pilotso11/ed-mcp`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ed-mcp-*.mcpb
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ed-mcp-*.mcpb --title "$GITHUB_REF_NAME" --generate-notes
      # Trusted publishing: npm takes a short-lived OIDC token from this workflow (id-token: write)
      # and adds provenance itself. No npm token is stored in the repository. A staged publish
      # goes live only after a maintainer approves it on npmjs.com with 2FA.
      - name: Stage npm publish
        # The check sees live versions only; `npm stage list` is not open to this workflow's token.
        # A re-run before the staged version is approved fails here. Approve or reject it first.
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "ed-mcp@$version" version >/dev/null 2>&1; then
            echo "ed-mcp@$version is already published on npm; skipping"
          else
            npm stage publish --access public
          fi
